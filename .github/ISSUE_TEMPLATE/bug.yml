name: Bug report
description: Report a reproducible problem in Agentic
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Agentic more reliable.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Agentic version or commit
      placeholder: v0.1.0 or a commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows version, Python, Node, Ollama model, RAM
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, personal data, and sensitive screen content.
      render: shell
