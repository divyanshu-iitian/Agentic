name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install pytest pyyaml loguru -r agentic-app/backend/requirements.txt
      - run: python -m pytest
      - run: python -m compileall -q core execution llm perception planning safety ui agentic-app/backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-app/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agentic-app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
