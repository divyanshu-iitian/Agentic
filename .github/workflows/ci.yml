name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,browser]" loguru -r agentic-app/backend/requirements.txt
      - name: Install Chromium for the browser tests
        run: python -m playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -m compileall -q agentic core execution llm perception planning safety ui agentic-app/backend
      - run: agentic --version

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-app/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agentic-app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
