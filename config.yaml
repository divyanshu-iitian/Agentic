# Agent Configuration

# LLM Settings
llm:
  provider: "ollama"
  model: "qwen2.5:3b"  # Good default for 8 GB RAM and CPU-only systems
  base_url: "http://localhost:11434"
  temperature: 0.2  # Slightly higher for creative tasks
  max_tokens: 768
  context_window: 4096
  timeout: 120
  max_parse_retries: 1
  keep_alive: "5m"

# Safety Settings
safety:
  max_actions_per_task: 30
  emergency_kill_hotkey: "ctrl+alt+q"
  enable_whitelist: true
  allowed_apps:
    - "notepad"
    - "calculator"
    - "chrome"
    - "firefox"
    - "brave"
    - "explorer"
  allowed_domains:
    - "google.com"
    - "github.com"
    - "wikipedia.org"
    - "stackoverflow.com"
  blocked_actions: []

# UI Settings
ui:
  activation_hotkey: "ctrl+space"
  always_on_top: true
  window_width: 560
  window_height: 100
  transparency: 0.95
  font_size: 12

# Observation Settings
observation:
  # Screens remain in memory unless the user explicitly enables capture logging.
  screenshot_on_action: false
  ocr_enabled: true
  ocr_languages: ["en"]
  dom_summarization: true
  max_dom_elements: 60

# Execution Settings
execution:
  desktop:
    click_delay: 0.5
    type_delay: 0.1
    screenshot_before_click: false
  browser:
    headless: false
    viewport_width: 1280
    viewport_height: 720
    default_timeout: 10000
    wait_after_navigation: 2

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/agent.log"
  max_size_mb: 50
  backup_count: 5
  console_output: true

# Memory
memory:
  state_file: "state/current_task.json"
  history_file: "state/action_history.json"
  max_history_items: 50
