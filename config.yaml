# Agent Configuration

# LLM Settings
# Providers: "ollama" (local Ollama) or "personaplex" (NVIDIA PersonaPlex via HuggingFace)
llm:
  provider: "personaplex"  # ✅ ENABLED - Using PersonaPlex!
  model: "nvidia/personaplex-7b-v1"  # PersonaPlex model
  base_url: "http://127.0.0.1:11434"  # Only for Ollama (ignored for PersonaPlex)
  temperature: 0.7  # Good for conversations
  max_tokens: 256  # Optimized for 8GB VRAM
  timeout: 300  # 5 minutes

# Safety Settings
safety:
  max_actions_per_task: 100  # Increased for complex tasks
  emergency_kill_hotkey: "ctrl+alt+q"
  enable_whitelist: false  # DISABLED - Agent can do everything
  allowed_apps: []  # Not enforced when whitelist disabled
  allowed_domains: []  # Not enforced when whitelist disabled
  blocked_actions: []  # No restrictions - full power mode

# UI Settings
ui:
  activation_hotkey: "ctrl+space"
  always_on_top: true
  window_width: 600
  window_height: 100
  transparency: 0.95
  font_size: 12

# Observation Settings
observation:
  vision_model: "llava-phi3"  # DeepSeek-VL not found on Ollama, switched to llava-phi3 (Microsoft Phi-3 Vision) which is excellent.
  screenshot_on_action: true
  ocr_enabled: true
  ocr_languages: ["en"]
  dom_summarization: true
  max_dom_elements: 100

# Execution Settings
execution:
  desktop:
    click_delay: 0.5
    type_delay: 0.1
    screenshot_before_click: true
  browser:
    headless: false
    viewport_width: 1920
    viewport_height: 1080
    default_timeout: 10000
    wait_after_navigation: 2

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/agent.log"
  max_size_mb: 50
  backup_count: 5
  console_output: true

# Memory
memory:
  state_file: "state/current_task.json"
  history_file: "state/action_history.json"
  max_history_items: 100
