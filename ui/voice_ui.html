<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: rgba(15, 15, 20, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-blue: #00d2ff;
            --accent-purple: #9d50bb;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: transparent;
        }

        /* Glassmorphism Container */
        .glass-container {
            width: 380px;
            height: 550px;
            background: var(--bg-color);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin: 20px;
        }

        .glass-container.collapsed {
            height: 80px;
            width: 80px;
            border-radius: 50%;
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-circle {
            width: 32px;
            height: 32px;
            background: linear-gradient(45deg, var(--accent-blue), var(--accent-purple));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }

        .title {
            color: var(--text-color);
            font-weight: 600;
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-blue) transparent;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .ai-message {
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .user-message {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(157, 80, 187, 0.2));
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Voice Waveform Area */
        .voice-section {
            padding: 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .waveform {
            height: 40px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .wave-bar {
            width: 4px;
            height: 10px;
            background: var(--accent-blue);
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        .listening .wave-bar {
            animation: bounce 0.6s infinite alternate;
        }

        .mic-button {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .mic-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
        }

        .mic-button.active {
            animation: pulse 1.5s infinite;
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 
            0% { height: 10px; } 
            100% { height: 35px; } 
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(0, 210, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0); }
        }

        /* Controls */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-color);
            opacity: 0.5;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .control-btn:hover { opacity: 1; }

        .collapsed-content {
            display: none;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: fadeIn 0.4s ease;
        }

        .collapsed .collapsed-content { display: flex; }
        .collapsed .header, .collapsed .chat-area, .collapsed .voice-section { display: none; }

    </style>
</head>
<body>

    <div id="main-container" class="glass-container">
        <!-- Collapsed Icon -->
        <div class="collapsed-content" onclick="toggleCollapse()">
            <div class="logo-circle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
            </div>
        </div>

        <div class="header">
            <div class="logo-area">
                <div class="logo-circle">A</div>
                <div class="title">Aether AI</div>
            </div>
            <div class="controls">
                <button class="control-btn" onclick="toggleCollapse()">—</button>
            </div>
        </div>

        <div class="chat-area" id="chat">
            <div class="message ai-message">Hello! [laugh] How can I help you today?</div>
        </div>

        <div class="voice-section">
            <div class="waveform" id="waveform">
                <div class="wave-bar" style="animation-delay: -0.1s"></div>
                <div class="wave-bar" style="animation-delay: -0.3s"></div>
                <div class="wave-bar" style="animation-delay: -0.5s"></div>
                <div class="wave-bar" style="animation-delay: -0.2s"></div>
                <div class="wave-bar" style="animation-delay: -0.4s"></div>
                <div class="wave-bar" style="animation-delay: -0.1s"></div>
                <div class="wave-bar" style="animation-delay: -0.6s"></div>
            </div>
            <button class="mic-button" id="mic-btn" onclick="startVoice()">
               <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </button>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const micBtn = document.getElementById('mic-btn');
        const waveform = document.getElementById('waveform');
        const container = document.getElementById('main-container');

        function addMessage(text, isUser = false) {
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            msg.textContent = text;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        let isListening = false;
        async function startVoice() {
            if (isListening) return;
            isListening = true;
            micBtn.classList.add('active');
            waveform.classList.add('listening');
            
            // Call Python binding
            const text = await pywebview.api.listen_and_process();
            
            isListening = false;
            micBtn.classList.remove('active');
            waveform.classList.remove('listening');
        }

        function toggleCollapse() {
            container.classList.toggle('collapsed');
        }
    </script>
</body>
</html>
